# Config for the dedicated `tmux -L pocket` server that hosts cc-* Claude sessions.
# A separate socket keeps these settings away from any other tmux use.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# Claude Code's desktop notifications and shift+enter need these.
set -g allow-passthrough on
set -s extended-keys on
set -as terminal-features ",*:extkeys"

set -g status-style "bg=default,fg=colour244"
set -g status-left "#[fg=colour173]#S "
set -g status-left-length 40
set -g status-right "pocket"
